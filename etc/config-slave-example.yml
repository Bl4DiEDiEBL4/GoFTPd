# Minimal slave-only config.
#
# Build the daemon, edit the values below, then start from this directory with:
#
#   ./weaveftpd --config etc/config-slave-example.yml
#
# If you prefer the default config path, copy this file to etc/config.yml and
# run ./weaveftpd without --config.

mode: "slave"
version: "dev"
timezone: "Europe/Amsterdam"
debug: false

# Optional but useful when running the slave detached.
log_file: "logs/weaveftpd-slave.log"
log_console: true
log_keep_days: 2

# Slave TLS. This controls the slave->master control connection and encrypted
# client data sockets, so the cert/key must exist when tls_enabled is true.
tls_enabled: true
tls_cert: "./etc/certs/server.crt"
tls_key: "./etc/certs/server.key"

# Refuse uploads when the selected slave root has less free space than this.
# Keep this aligned with the master config.
free_space_mb: 2048

slave:
  # Must match a master-side slaves[].name policy if you use policies.
  name: "LOCAL"

  # Master control socket.
  master_host: "127.0.0.1"
  master_port: 1099

  # Master-slave mTLS (recommended). master_ca_cert verifies the master's
  # presented server cert (real verification instead of InsecureSkipVerify);
  # client_cert/client_key is this slave's own identity - its CN MUST equal
  # `name` above, since the master checks the two match. Generate the
  # CA/server cert with `./setup.sh certs` on the master, then
  # run `./setup.sh slavecert LOCAL` and copy the three required files here.
  # Leave all three empty only for the legacy IP-mask fallback. TLS remains
  # encrypted in that mode, but the slave does not verify the master identity;
  # an IP mask authenticates this slave to the master, not the reverse. Register
  # the mask with SITE SLAVE <name> ADDMASK <ip/cidr>.
  master_ca_cert: ""
  client_cert: ""
  client_key: ""

  # Normal site root(s), exposed at virtual "/".
  roots:
    - "./site"

  # Optional: expose separate physical disks under one virtual archive path.
  # Leave this as [] when the slave only serves the normal roots above.
  # This is useful for NFS-mounted archive disks without putting mergerfs in
  # front of WeaveFTPd.
  mounted_roots: []
  # To use archive mounts, replace mounted_roots: [] above with:
  #
  # mounted_roots:
  #   - path: "/glftpd/DISK1"
  #     mount_path: "/ARCHiVE"
  #   - path: "/glftpd/DISK2"
  #     mount_path: "/ARCHiVE"

  # Passive ports used when clients connect directly to this slave.
  pasv_port_min: 30000
  pasv_port_max: 65000

  # Public IP advertised by this slave in PASV replies. Leave empty only when
  # auto-detect from the master connection is correct.
  bind_ip: ""

  # Optional local interface used for passive listeners and outbound FXP
  # connections. Behind NAT this is the machine's LAN IP, not bind_ip.
  # Leave empty to listen on all interfaces and let Windows choose outbound.
  local_bind_ip: ""

  timeout: 60

  transfer_buffer_size: 4194304
